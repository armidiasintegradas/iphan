<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPHAN · Revisão · Login</title>
  <link rel="stylesheet" href="style.css?v=20260929-4">
</head>
<body>
  <main class="login-review">
    <section class="login-photo" aria-label="Patrimônio histórico de Pernambuco"></section>
    <section class="login-panel">
      <div class="login-inner">
        <div class="iphan-lockup" aria-label="Iphan — Instituto do Patrimônio Histórico e Artístico Nacional">
          <div class="iphan-symbol" aria-hidden="true">
            <svg viewBox="0 0 126 78">
              <rect x="1.5" y="1.5" width="123" height="75" fill="none" stroke="currentColor" stroke-width="3"/>
              <path d="M22 2v74M1 39h123M63 2v74" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <path d="M22 20h41M22 58h41M63 20h39M63 58h39" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M42 2v18M42 58v18M83 2v18M83 58v18" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <div class="iphan-word">IPHAN</div>
          </div>
          <div class="iphan-name">
            <span>Instituto do Patrimônio</span>
            <span>Histórico e Artístico</span>
            <span>Nacional</span>
          </div>
        </div>

        <h1>Sistema de Gestão<br>da Preservação</h1>
        <div class="login-subtitle">
          <span>Superintendência de Pernambuco</span>
          <span class="beta">Beta 01</span>
        </div>

        <form class="login-form" onsubmit="return false">
          <label class="field"><span class="icon">✉</span><input type="email" placeholder="E-mail institucional"></label>
          <label class="field"><span class="icon lock">▣</span><input type="password" value="************" aria-label="Senha"><span class="eye">◉</span></label>
          <label class="remember"><input type="checkbox" checked><span>Manter conectado</span></label>
          <button class="enter">Entrar <span>→</span></button>
        </form>

        <a class="forgot" href="#">Esqueci minha senha</a>
        <div class="tagline"><i></i><p>Patrimônio que conecta<br>pessoas e futuros.</p></div>
      </div>

      <div class="ornament-vector" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </section>
  </main>
</body>
</html>
