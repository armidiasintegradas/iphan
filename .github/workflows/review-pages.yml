name: Review Pages

on:
  push:
    branches: ["main"]
    paths:
      - "review/**"
      - "public/preview/**"
      - ".github/workflows/review-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "review-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static review
        run: |
          mkdir -p _site/assets
          cp -R review/. _site/
          cp public/preview/* _site/assets/ 2>/dev/null || true
          cp public/visual/heritage-hero.webp _site/assets/heritage-hero.webp 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
