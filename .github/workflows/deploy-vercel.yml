name: Deploy Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TEAM_SLUG: arm-idias
      VERCEL_PROJECT_NAME: iphan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect deployment token
        id: vercel_auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; deployment steps will be skipped."
          fi

      - run: npm install
      - run: npm run verify:beta
      - run: npm run build

      - name: Install Vercel CLI
        if: steps.vercel_auth.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Ensure Vercel project exists
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN" >/dev/null 2>&1 ||           vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Link repository to Vercel project
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Pull production environment
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Build Vercel output
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN")
          echo "Production deployment: $DEPLOY_URL"
          echo "$DEPLOY_URL" > vercel-production-url.txt

      - name: Verify production response
        if: steps.vercel_auth.outputs.available == 'true'
        run: |
          DEPLOY_URL=$(cat vercel-production-url.txt)
          curl --fail --location --silent --show-error "$DEPLOY_URL/api/health" | tee health.json
          grep -q '"ok":true' health.json
          echo "Production health check passed."
