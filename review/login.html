<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPHAN · Revisão · Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="review-body">
  <main class="login-review">
    <section class="login-photo" aria-label="Fotografia de patrimônio histórico"></section>

    <section class="login-panel">
      <div class="login-inner">
        <img class="iphan-logo" src="assets/iphan-approved-logo.webp" alt="Iphan — Instituto do Patrimônio Histórico e Artístico Nacional">

        <h1>Sistema de Gestão<br>da Preservação</h1>

        <div class="login-subtitle">
          <span>Superintendência de Pernambuco</span>
          <span class="beta">Beta 01</span>
        </div>

        <form class="login-form" onsubmit="return false">
          <label class="field">
            <span class="icon">✉</span>
            <input type="email" placeholder="E-mail institucional">
          </label>

          <label class="field">
            <span class="icon lock">▣</span>
            <input type="password" value="************" aria-label="Senha">
            <span class="eye">◉</span>
          </label>

          <label class="remember">
            <input type="checkbox" checked>
            <span>Manter conectado</span>
          </label>

          <button class="enter">Entrar <span>→</span></button>
        </form>

        <a class="forgot" href="#">Esqueci minha senha</a>

        <div class="tagline">
          <i></i>
          <p>Patrimônio que conecta<br>pessoas e futuros.</p>
        </div>
      </div>

      <img class="ornament" src="assets/login-approved-ornament.webp" alt="" aria-hidden="true">
    </section>

    <a class="review-index" href="index.html">Revisão visual · Login</a>
  </main>
  <script>
    (async () => {
      const photo = document.querySelector('.login-photo');
      try {
        const [a, b] = await Promise.all([
          fetch('assets/login-photo-a.txt', {cache:'no-store'}).then(r => {
            if (!r.ok) throw new Error('photo-a');
            return r.text();
          }),
          fetch('assets/login-photo-b.txt', {cache:'no-store'}).then(r => {
            if (!r.ok) throw new Error('photo-b');
            return r.text();
          })
        ]);
        const data = (a + b).replace(/\\s+/g, '');
        photo.style.backgroundImage = 'url("data:image/webp;base64,' + data + '")';
        photo.classList.add('is-loaded');
      } catch (error) {
        photo.classList.add('load-error');
        console.error('Falha ao carregar a fotografia aprovada', error);
      }
    })();
  </script>
</body>
</html>
